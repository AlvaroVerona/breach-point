[project]
name = "breach-point"
version = "0.1.0"
description = "Breach Point — Financial Data Quality, Forecasting & Liquidity Optimization Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alvaro Verona" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "streamlit>=1.37",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pandera>=0.20",
    "joblib>=1.4",
    "ortools>=9.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
