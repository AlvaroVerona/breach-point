# Breach Point — central configuration.
# Every stochastic component reads its seed from here. Do not hardcode
# constants (dates, thresholds, counts) anywhere else in the codebase.

data:
  seed: 42
  n_transactions: 100000
  start_date: "2023-01-01"
  end_date: "2025-12-31"
  base_currency: "EUR"
  currencies: ["EUR", "USD", "GBP"]
  entities: ["ENT_EU", "ENT_US", "ENT_UK"]
  business_units: ["Sales", "Operations", "Marketing", "R&D", "Corporate"]
  n_accounts: 120
  duplicate_rate: 0.008
  missing_rate:
    default: 0.02
    currency: 0.002
    amount: 0.0005
    optional_metadata: 0.05
  invalid_rate: 0.01
  unbalanced_journal_rate: 0.002
  missing_period_rate: 0.01

quality:
  severity:
    missing_transaction_id: CRITICAL
    missing_amount: CRITICAL
    missing_currency: HIGH
    missing_account_id: CRITICAL
    missing_entity_id: CRITICAL
    missing_payment_date_unpaid: LOW
    missing_payment_date_inconsistent: HIGH
    missing_optional_metadata: INFO
    duplicate_exact: HIGH
    duplicate_business_key: HIGH
    duplicate_near: MEDIUM
    duplicate_invoice: HIGH
    invalid_currency: HIGH
    invalid_account: HIGH
    invalid_entity: HIGH
    invalid_date: HIGH
    inconsistent_classification: HIGH
    payment_before_invoice: HIGH
    negative_amount_not_allowed: MEDIUM
    amount_mismatch: MEDIUM
    journal_entry_unbalanced: CRITICAL
    balance_sheet_imbalance: CRITICAL
    income_statement_mismatch: HIGH
    cash_flow_reconciliation_failure: HIGH
    subledger_tie_out_failure: HIGH
  tolerance_eur: 0.01
  score_weights:
    completeness: 0.2
    uniqueness: 0.2
    validity: 0.2
    consistency: 0.2
    reconciliation: 0.2

forecast:
  horizon_months: 12
  validation_months: 6

simulation:
  n_simulations: 10000

liquidity:
  # ~2 months of consolidated operating cash outflow (COGS + Operating
  # Expense run-rate is ~EUR 1.37M/month as of the last historical month,
  # see reports/outputs/income_statement.csv) -- a standard treasury
  # liquidity-buffer policy, not the spec's illustrative EUR 1,000,000
  # example, which is far below this company's actual scale (~EUR 18M
  # cash on hand) and would make the risk score trivially LOW forever.
  minimum_cash: 2750000
  risk_thresholds:
    low_max_breach_prob: 0.05
    medium_max_breach_prob: 0.20
    high_max_breach_prob: 0.50

optimization:
  max_borrowing: 5000000
  borrowing_rate_annual: 0.07
  max_payment_delay_days: 30
  max_collections_acceleration_pct: 0.15
  max_capex_reduction_pct: 0.30
  # One-time cost of factoring/accelerating a euro of receivables (a
  # discount given for early payment / invoice-factoring fee), and of
  # deferring a euro of planned CAPEX (a rough proxy for the value lost
  # from delaying growth/maintenance investment). Payment delay has no
  # direct financial cost in this model -- it's bounded by
  # max_payment_delay_days and reported separately as operational impact,
  # since the real cost (strained vendor relationships) isn't a euro figure.
  factoring_discount_rate: 0.02
  capex_delay_cost_rate: 0.05
  # A hypothetical, stricter minimum-cash policy (e.g. "what if the board
  # wanted a much larger safety margin, or the group had to pre-fund a
  # major obligation") used ONLY to exercise the optimizer's decision
  # mechanism. Necessary because this company's real liquidity.minimum_cash
  # (EUR 2.75M) is never threatened even under the stress_scenario below --
  # the group's pooled cash position is genuinely resilient (see CLAUDE.md).
  # Never presented as the actual liquidity policy.
  demo_minimum_cash: 16000000

# A more severe stress test (§32-style scenario, beyond "pessimistic"),
# used by the optimizer (Phase 9) together with demo_minimum_cash above.
# Phase 8's base/optimistic/pessimistic scenarios all show LOW risk against
# the real EUR 2.75M policy (see CLAUDE.md); this scenario alone still
# doesn't breach that real policy -- only combined with the hypothetical
# demo_minimum_cash does the optimizer have levers to actually use. Never
# presented as a forecast; always labeled "stress test".
stress_scenario:
  revenue_pct: -0.35
  opex_pct: 0.10
  dso_days: 25.0
  dpo_days: -10.0
